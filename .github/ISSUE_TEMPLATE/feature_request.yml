name: Feature request
description: Suggest an improvement or a new feature
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem you'd like solved, not only the solution. Use made-up examples rather than your real medications.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: When I take a medication on alternate days, I have to...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you've tried
